  <circle cx="512" cy="512" r="330" fill="none" stroke="#E5484D" stroke-width="58"/>
  <circle cx="512" cy="512" r="262" fill="none" stroke="#F1EAD6" stroke-width="10"/>
  <ellipse cx="512" cy="590" rx="212" ry="112" fill="url(#rice)"/>
  <ellipse cx="512" cy="600" rx="190" ry="60" fill="#DED3B6" opacity="0.5"/>
  <path d="M292 500 C 300 400, 724 400, 732 500 C 740 560, 700 592, 512 592 C 324 592, 284 560, 292 500 Z" fill="url(#fish)"/>
  <path d="M330 470 C 400 440, 620 440, 700 470" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="14" stroke-linecap="round"/>
